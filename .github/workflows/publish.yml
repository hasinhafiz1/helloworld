name: Build and push docker image to dockerhub

on:
    push:
        branches: ["test"]

permissions:
  id-token: write
  contents: read

jobs:
    docker:
        environment: test
        if: contains(github.event.head_commit.message, 'docker')
        runs-on: ubuntu-latest

        steps:

            - name: Dockerhub auth
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Build and push Docker image
              uses: docker/build-push-action@v6.17.0
              with:
                push: ${{ github.event_name != 'pull_request' }}
                tags: hhafiz/app:latest


            # - name: Deploy to EC2 Instance
            #   uses: appleboy/ssh-action@v1.0.0
            #   with:
            #     host: ${{ secrets.EC2_HOST }}
            #     username: ${{ secrets.EC2_USER }}
            #     key: ${{ secrets.EC2_SSH_KEY }}
            #     script: |
            #       /home/ec2-user/scripts/run.sh

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-region: ${{ secrets.AWS_REGION }}
                role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}

            # - name: Deploy to Amazon ECS
            #   run: |
            #     aws ecs update-service --cluster ${{ secrets.ECS_CLUSTER }} --service ${{ secrets.ECS_SERVICE }} --force-new-deployment --region ${{ secrets.AWS_REGION }}

            - name: Render Amazon ECS task definition
              id: render-web-container
              uses: aws-actions/amazon-ecs-render-task-definition@v1
              with:
                task-definition: ${{ secrets.ECS_TASK_DEFINITION_FAMILY }}
                task-definition-arn:  ${{ secrets.ECS_TASK_DEFINITION_ARN }}
                task-definition-family: helloworld-task 
                #task-definition-revision: task-definition-revision
                container-name: helloworld-containers
                image: hhafiz/app:latest
                environment-variables: |
                  MY_SECRET=${{ secrets.MY_SECRET }}
                secrets: "SECRET_KEY=arn:aws:ssm:region:0123456789:parameter/secret"

            - name: Deploy to Amazon ECS service
              uses: aws-actions/amazon-ecs-deploy-task-definition@v2
              with:
                task-definition: ${{ steps.render-web-container.outputs.task-definition }}
                service: ${{ secrets.ECS_SERVICE }}
                cluster: ${{ secrets.ECS_CLUSTER  }}

            